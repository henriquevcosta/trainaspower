[project]
name = "trainaspower"
version = "0.7.7"
description = "Convert TrainAsOne plans to power and upload to Final Surge for use with Stryd pod."
authors = [{ name = "Chase Sterling", email = "chase.sterling@gmail.com" }]
requires-python = ">=3.8,<4,<3.14"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "requests>=2.27,<3",
    "lxml-html-clean>=0.4.1,<0.5",
    "requests-html>=0.10.0,<0.11",
    "dateparser>=1.1.1,<2",
    "PyYAML>=6.0,<7",
    "loguru>=0.6.0,<0.7",
    "Pint>=0.18,<0.19",
    "pydantic>=1.9,<2",
    "fitparse>=1.2.0,<2",
    "beautifulsoup4>=4.14.2,<5",
    "html5lib>=1.1,<2",
]

[project.scripts]
trainaspower = "trainaspower.main:main"
workout-analysis = "workout_analysis.main:main"

[dependency-groups]
dev = ["pyinstaller>=6.12,<7"]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""
module-name = ["trainaspower", "workout_analysis"]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
